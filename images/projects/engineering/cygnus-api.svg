<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Cygnus API architecture placeholder</title>
  <desc id="desc">A dark technical network diagram showing API, auth, SQL, docs, and service nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="0.55" stop-color="#17151d"/>
      <stop offset="1" stop-color="#241d13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d19f39"/>
      <stop offset="1" stop-color="#d19f39"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <g opacity=".24" stroke="#d19f39" stroke-width="1">
    <path d="M0 120h960M0 240h960M0 360h960M0 480h960M0 600h960"/>
    <path d="M120 0v720M240 0v720M360 0v720M480 0v720M600 0v720M720 0v720M840 0v720"/>
  </g>
  <g stroke="#d19f39" stroke-width="3" stroke-dasharray="8 10" opacity=".82">
    <path d="M480 350 270 205"/>
    <path d="M480 350 705 210"/>
    <path d="M480 350 250 520"/>
    <path d="M480 350 720 525"/>
    <path d="M480 350 480 135"/>
  </g>
  <g>
    <circle cx="480" cy="350" r="92" fill="#111318" stroke="url(#gold)" stroke-width="3"/>
    <text x="480" y="338" text-anchor="middle" fill="#d19f39" font-family="Arial, sans-serif" font-size="44" font-weight="800">API</text>
    <text x="480" y="378" text-anchor="middle" fill="#d19f39" font-family="Consolas, monospace" font-size="18">REST / OAuth2</text>
  </g>
  <g font-family="Consolas, monospace" font-size="20" font-weight="700">
    <g>
      <rect x="135" y="150" width="270" height="110" rx="8" fill="#15151b" stroke="#d19f39"/>
      <text x="270" y="197" text-anchor="middle" fill="#d19f39">Account Auth</text>
      <text x="270" y="230" text-anchor="middle" fill="#d19f39">tokens / roles</text>
    </g>
    <g>
      <rect x="560" y="150" width="290" height="110" rx="8" fill="#15151b" stroke="#d19f39"/>
      <text x="705" y="197" text-anchor="middle" fill="#d19f39">Swagger Docs</text>
      <text x="705" y="230" text-anchor="middle" fill="#d19f39">API contract</text>
    </g>
    <g>
      <rect x="115" y="470" width="270" height="110" rx="8" fill="#15151b" stroke="#d19f39"/>
      <text x="250" y="517" text-anchor="middle" fill="#d19f39">SQL Data</text>
      <text x="250" y="550" text-anchor="middle" fill="#d19f39">migrations</text>
    </g>
    <g>
      <rect x="575" y="470" width="290" height="110" rx="8" fill="#15151b" stroke="#d19f39"/>
      <text x="720" y="517" text-anchor="middle" fill="#d19f39">Docker Stack</text>
      <text x="720" y="550" text-anchor="middle" fill="#d19f39">api / db / mail</text>
    </g>
    <g>
      <rect x="345" y="70" width="270" height="100" rx="8" fill="#15151b" stroke="#d19f39"/>
      <text x="480" y="115" text-anchor="middle" fill="#d19f39">Game Data</text>
      <text x="480" y="146" text-anchor="middle" fill="#d19f39">import pipeline</text>
    </g>
  </g>
  <text x="48" y="650" fill="#d19f39" font-family="Consolas, monospace" font-size="18">CYGNUS_API / platform graph</text>
</svg>
